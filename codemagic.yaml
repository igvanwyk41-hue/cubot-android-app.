workflows:
  cubot-android:
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    name: CUBOT Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.cubot.mobile"
      java: 17
    scripts:
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build installable Android APK
        script: bash gradlew --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/**/output-metadata.json
