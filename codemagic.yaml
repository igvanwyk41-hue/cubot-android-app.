workflows:
  cubot-android:
    name: CUBOT Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.cubot.mobile"
      java: 17
    scripts:
      - name: Check Android project
        script: |
          gradle --version
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/com/cubot/mobile/MainActivity.java
      - name: Build installable Android APK
        script: |
          gradle --no-daemon clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/**/output-metadata.json
