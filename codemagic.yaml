workflows:
  cubot-android:
    name: CUBOT Android
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.cubot.mobile"
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          gradle --version
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
